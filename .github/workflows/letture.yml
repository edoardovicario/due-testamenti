name: Letture quotidiane e pubblicazione
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['site/data/**']
  schedule:
    - cron: '17 0,6,12,18 * * *'
concurrency:
  group: due-testamenti-pages
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Recupera letture di oggi e prossimi giorni
        run: python update_site.py
      - name: Sincronizza le puntate dal podcast Spotify ufficiale
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python podcast_sync.py
      - name: Sincronizza il canale YouTube di Epicoco
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_sync.py
      - name: Salva archivio delle letture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/ site/podcast_catalog.json site/youtube_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna archivio liturgico'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
